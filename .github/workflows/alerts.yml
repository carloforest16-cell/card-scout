name: Alertes (déclenchement manuel de secours)

# Les alertes prix + watchlist tournent toutes les 15 min via pg_cron dans
# Supabase (supabase/migrations/20260924_alerts_pg_cron.sql) — précis à la
# minute. L'horaire GitHub a été retiré : GitHub lançait ses tâches planifiées
# avec 4-5 h de retard sur ce dépôt. Ce workflow reste disponible en
# lancement manuel (onglet Actions → Run workflow) si pg_cron tombe.
# Jeton dédié ALERTS_TRIGGER_TOKEN (voir lib/alertsTrigger.js).

on:
  workflow_dispatch:

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Déclencher les alertes
        env:
          TOKEN: ${{ secrets.ALERTS_TRIGGER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret ALERTS_TRIGGER_TOKEN manquant"
            exit 1
          fi
          fail=0
          for route in price-alerts watchlist-alerts; do
            # www : l'apex redirige (308) et curl ne renvoie pas l'en-tête
            # Authorization après une redirection vers un autre hôte.
            code=$(curl -s -o out.json -w "%{http_code}" -m 290 \
              -H "Authorization: Bearer $TOKEN" \
              "https://www.cardmetrics.io/api/cron/$route")
            echo "$route → HTTP $code : $(head -c 300 out.json)"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
